<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 1760 860"><title id="title">DRAM 字位扩展连接图</title><desc id="desc">CPU 的高两位地址经译码后选择片组，低十四位地址利用 DRAM 行列地址复用分时送入芯片；四组八位芯片并联形成三十二位数据通路。</desc><defs><marker id="arrow-blue" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M0 0 10 5 0 10Z"/></marker><marker id="arrow-amber" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#d97706" d="M0 0 10 5 0 10Z"/></marker><style>text{font-family:&quot;Helvetica Neue&quot;,Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#0f172a}.label{font-size:30px;font-weight:650}.note{font-size:24px;fill:#475569}.chip-title{font-size:34px;font-weight:700;text-anchor:middle}.chip-subtitle{font-size:23px;fill:#64748b;text-anchor:middle}.bus{fill:none;stroke-linecap:square;stroke-linejoin:miter}</style></defs><rect width="190" height="735" x="42" y="42" fill="#fff7ed" stroke="#d97706" stroke-width="2"/><text x="137" y="410" class="label" text-anchor="middle">CPU</text><text x="70" y="112" fill="#92400e" class="label">A₁₅–A₁₄</text><path stroke="#d97706" stroke-width="4" marker-end="url(#arrow-amber)" d="M232 102 H302" class="bus"/><g aria-label="二到四译码器"><path fill="#fffbeb" stroke="#d97706" stroke-width="2.5" d="M310 62 H450 L492 102 450 142 H310Z"/><text x="391" y="96" fill="#92400e" class="label" text-anchor="middle">2 → 4</text><text x="391" y="125" fill="#92400e" class="note" text-anchor="middle">片组选取</text></g><path stroke="#d97706" stroke-width="3" marker-end="url(#arrow-amber)" d="M492 102 H585 V215" class="bus"/><path stroke="#d97706" stroke-width="3" marker-end="url(#arrow-amber)" d="M492 102 H870 V215" class="bus"/><path stroke="#d97706" stroke-width="3" marker-end="url(#arrow-amber)" d="M492 102 H1155 V215" class="bus"/><path stroke="#d97706" stroke-width="3" marker-end="url(#arrow-amber)" d="M492 102 H1440 V215" class="bus"/><text x="70" y="226" fill="#5b4b8a" class="label">A₁₃–A₀</text><path stroke="#7c6597" stroke-width="4" d="M232 216 H1644" class="bus"/><path stroke="#7c6597" stroke-width="3" d="M585 216 V283 M870 216 V283 M1155 216 V283 M1440 216 V283" class="bus"/><g transform="translate(490 300)"><rect width="190" height="250" x="-26" y="-26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><rect width="190" height="250" x="-13" y="-13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><rect width="190" height="250" x="0" y="0" fill="#fff9db" stroke="#ca8a04" stroke-width="2.5"/><text x="95" y="100" class="chip-title">16K × 8</text><text x="95" y="142" class="chip-subtitle">DRAM</text><text x="95" y="190" class="chip-subtitle">片组 × 4</text></g><g transform="translate(775 300)"><rect width="190" height="250" x="-26" y="-26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><rect width="190" height="250" x="-13" y="-13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><rect width="190" height="250" x="0" y="0" fill="#fff9db" stroke="#ca8a04" stroke-width="2.5"/><text x="95" y="100" class="chip-title">16K × 8</text><text x="95" y="142" class="chip-subtitle">DRAM</text><text x="95" y="190" class="chip-subtitle">片组 × 4</text></g><g transform="translate(1060 300)"><rect width="190" height="250" x="-26" y="-26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><rect width="190" height="250" x="-13" y="-13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><rect width="190" height="250" x="0" y="0" fill="#fff9db" stroke="#ca8a04" stroke-width="2.5"/><text x="95" y="100" class="chip-title">16K × 8</text><text x="95" y="142" class="chip-subtitle">DRAM</text><text x="95" y="190" class="chip-subtitle">片组 × 4</text></g><g transform="translate(1345 300)"><rect width="190" height="250" x="-26" y="-26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><rect width="190" height="250" x="-13" y="-13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><rect width="190" height="250" x="0" y="0" fill="#fff9db" stroke="#ca8a04" stroke-width="2.5"/><text x="95" y="100" class="chip-title">16K × 8</text><text x="95" y="142" class="chip-subtitle">DRAM</text><text x="95" y="190" class="chip-subtitle">片组 × 4</text></g><path stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)" d="M232 680 H1640" class="bus"/><path stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)" d="M585 550 V680 M870 550 V680 M1155 550 V680 M1440 550 V680" class="bus"/><g transform="translate(320 735)"><line x1="0" x2="1120" y1="0" y2="0" stroke="#cbd5e1" stroke-width="1.5"/><text x="0" y="44" class="note"><tspan fill="#2563eb" font-weight="700">横向并联</tspan><tspan dx="12">4 × 8 位 = 32 位，完成位扩展</tspan></text><text x="610" y="44" class="note"><tspan fill="#d97706" font-weight="700">纵深片组</tspan><tspan dx="12">高 2 位选 1 组，完成字扩展</tspan></text></g></svg>